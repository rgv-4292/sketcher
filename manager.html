<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketcher — Manager</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: #ddd;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    #navbar {
      background: #333;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    #navbar h1 {
      font-size: 14px;
      color: #aaa;
      font-weight: normal;
      margin-right: auto;
    }

    .nav-btn {
      background: #444;
      color: #ccc;
      border: none;
      padding: 7px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .nav-btn:hover {
      background: #555;
    }

    .nav-btn.primary {
      background: #5a7a5a;
      color: #fff;
    }

    .nav-btn.primary:hover {
      background: #6a8a6a;
    }

    .nav-btn.danger {
      background: #7a3a3a;
      color: #fff;
    }

    .nav-btn.danger:hover {
      background: #8a4a4a;
    }

    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Book list panel */
    #bookPanel {
      width: 200px;
      background: #222;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    #bookPanel h2 {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 10px 12px 6px;
      border-bottom: 1px solid #333;
    }

    #bookList {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }

    .book-item {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      border-left: 3px solid transparent;
    }

    .book-item:hover {
      background: #2a2a2a;
    }

    .book-item.active {
      background: #2a2a2a;
      border-left-color: #6a8a6a;
      color: #fff;
    }

    #newBookBtn {
      margin: 8px;
      width: calc(100% - 16px);
    }

    /* Page list panel */
    #pagePanel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #pagePanelHeader {
      padding: 10px 12px 6px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #pagePanelHeader h2 {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      flex: 1;
    }

    #bookSettings {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: #888;
    }

    #bookSettings input {
      width: 50px;
      background: #333;
      border: 1px solid #555;
      color: #fff;
      padding: 3px 5px;
      border-radius: 3px;
      font-size: 12px;
    }

    #pageList {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .page-item {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      cursor: grab;
      transition: background 0.1s;
    }

    .page-item:hover {
      background: #333;
    }

    .page-item.dragging {
      opacity: 0.4;
    }

    .page-item.drag-over {
      border-color: #6a8a6a;
    }

    .page-thumb {
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #666;
      flex-shrink: 0;
      border: 1px solid #444;
      overflow: hidden;
      padding: 0;
    }

    .page-info {
      flex: 1;
      min-width: 0;
    }

    .page-caption {
      font-size: 13px;
      color: #ccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .page-caption-input {
      font-size: 13px;
      background: #333;
      border: 1px solid #666;
      color: #fff;
      padding: 2px 5px;
      border-radius: 3px;
      width: 100%;
    }

    .page-meta {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }

    .page-durations {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 11px;
      color: #777;
      flex-shrink: 0;
    }

    .page-durations input {
      width: 40px;
      background: #333;
      border: 1px solid #444;
      color: #ccc;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 11px;
      text-align: center;
    }

    .page-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .page-btn {
      background: #3a3a3a;
      color: #aaa;
      border: none;
      padding: 6px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }

    .page-select-cb {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: #6a8a6a;
      margin-right: 2px;
    }

    .page-btn:hover {
      background: #4a4a4a;
      color: #fff;
    }

    .page-btn.danger:hover {
      background: #7a3a3a;
      color: #fff;
    }

    .page-btn.active {
      background: #5a7a5a;
      color: #fff;
    }

    .page-btn.active:hover {
      background: #6a8a6a;
    }

    #newPageBtn {
      margin: 8px;
      align-self: flex-start;
    }

    /* Empty state */
    #emptyState {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 14px;
    }

    /* Modal */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    #modal.visible {
      display: flex;
    }

    #modalBox {
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 20px;
      width: 300px;
    }

    #modalBox h3 {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 14px;
    }

    .modal-row {
      margin-bottom: 12px;
    }

    .modal-row label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }

    .modal-row input,
    .modal-row select {
      width: 100%;
      background: #333;
      border: 1px solid #555;
      color: #fff;
      padding: 6px 8px;
      border-radius: 3px;
      font-size: 13px;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    #statusBar {
      background: #222;
      border-top: 1px solid #333;
      padding: 5px 12px;
      font-size: 11px;
      color: #666;
      flex-shrink: 0;
    }

    /* Progress bar */
    #progressContainer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 200;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    #progressContainer.visible {
      display: flex;
    }

    #progressLabel {
      color: #ccc;
      font-size: 14px;
    }

    #progressBarOuter {
      width: 320px;
      height: 12px;
      background: #333;
      border-radius: 6px;
      overflow: hidden;
    }

    #progressBarInner {
      height: 100%;
      background: #6a8a6a;
      border-radius: 6px;
      width: 0%;
      transition: width 0.1s;
    }

    #progressCancel {
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div id="navbar">
    <h1>Sketcher — Book Manager</h1>
    <button class="nav-btn" id="refreshBtn">Refresh</button>
    <button class="nav-btn" id="openViewerBtn">Open Viewer</button>
    <button class="nav-btn" id="openSketcherBtn">Open Sketcher</button>
    <button class="nav-btn primary" id="exportPngBtn" disabled>Export PNG</button>
    <button class="nav-btn primary" id="exportVideoBtn" disabled>Export Video</button>
  </div>

  <div id="main">
    <div id="bookPanel">
      <h2>Books</h2>
      <button class="nav-btn" id="newBookBtn">+ New Book</button>
      <div id="bookList"></div>
    </div>

    <div id="pagePanel">
      <div id="pagePanelHeader">
        <h2 id="pagePanelTitle">Select a Book</h2>
        <button class="nav-btn" id="selectAllBtn" style="display:none;padding:3px 8px;font-size:12px;">All</button>
        <button class="nav-btn" id="deselectAllBtn" style="display:none;padding:3px 8px;font-size:12px;">None</button>
        <button class="nav-btn" id="newPageBtn" style="display:none;">+ New Page</button>
        <div id="bookSettings" style="display:none;">
          <span>Page dur:</span>
          <input type="number" id="defaultPageDuration" value="5" min="1" max="60">
          <span>s &nbsp; Trans:</span>
          <input type="number" id="defaultTransDuration" value="1" min="0" max="10">
          <span>s &nbsp; Caption px:</span>
          <input type="number" id="captionFontSize" value="24" min="8" max="120" style="width:44px;">
          <button class="nav-btn" id="saveBookSettingsBtn" style="padding:3px 8px;font-size:12px;">Save</button>
        </div>
      </div>

      <div id="emptyState">Select or create a book</div>
      <div id="pageList" style="display:none;"></div>
      <button class="nav-btn" id="newPageBtn" style="display:none;">+ New Page</button>
    </div>
  </div>

  <div id="statusBar">Ready</div>

  <!-- Modal -->
  <div id="modal">
    <div id="modalBox">
      <h3 id="modalTitle">New Book</h3>
      <div class="modal-row">
        <label>Book Name</label>
        <input type="text" id="modalBookName" placeholder="MyBook">
      </div>
      <div class="modal-row">
        <label>Format</label>
        <select id="modalFormat">
          <optgroup label="Portrait">
            <option value="portrait_720x960">Portrait 720 × 960</option>
            <option value="portrait_480x640">Portrait 480 × 640</option>
            <option value="portrait_240x360">Portrait 240 × 360</option>
          </optgroup>
          <optgroup label="Landscape">
            <option value="landscape_960x720">Landscape 960 × 720</option>
            <option value="landscape_640x480">Landscape 640 × 480</option>
            <option value="landscape_360x240">Landscape 360 × 240</option>
          </optgroup>
          <optgroup label="Square">
            <option value="square_360">Square 360 × 360</option>
            <option value="square_480">Square 480 × 480</option>
            <option value="square_640">Square 640 × 640</option>
            <option value="square_720">Square 720 × 720</option>
            <option value="square_960">Square 960 × 960</option>
          </optgroup>
        </select>
      </div>
      <div class="modal-buttons">
        <button class="nav-btn" id="modalCancel">Cancel</button>
        <button class="nav-btn primary" id="modalConfirm">Create</button>
      </div>
    </div>
  </div>

  <!-- Progress overlay -->
  <div id="progressContainer">
    <div id="progressLabel">Preparing export...</div>
    <div id="progressBarOuter">
      <div id="progressBarInner"></div>
    </div>
    <button class="nav-btn danger" id="progressCancel">Cancel</button>
  </div>

  <script type="module" src="./manager.js"></script>
</body>

</html>
